{% extends 'users/userbase.html' %}
{% load static %}

{% block content %}
<div class="container" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg" style="border-radius: 15px;">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Verify OTP & Reset Password</h3>
                    <p class="text-center text-muted">Enter the 6-digit OTP sent to your email.</p>
                    
                    <form method="POST" action="{% url 'VerifyOTP' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Enter OTP</label>
                            <input type="text" name="otp" class="form-control" required placeholder="123456" maxlength="6">
                        </div>
                        <div class="form-group mt-3">
                            <label>New Password</label>
                            <input type="password" name="new_password" class="form-control" required placeholder="New Password">
                        </div>
                        <div class="form-group mt-3">
                            <label>Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm New Password">
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success w-100">Reset Password</button>
                        </div>
                    </form>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} mt-3 text-center">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
