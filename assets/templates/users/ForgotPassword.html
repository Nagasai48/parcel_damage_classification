{% extends 'users/userbase.html' %}
{% load static %}

{% block content %}
<div class="container" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg" style="border-radius: 15px;">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Forgot Password</h3>
                    <p class="text-center text-muted">Enter your email address to receive an OTP to reset your password.</p>
                    
                    <form method="POST" action="{% url 'ForgotPassword' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="Enter your registered email">
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Send OTP</button>
                        </div>
                    </form>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} mt-3 text-center">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
